<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What's in My Fridge?</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container py-4 py-lg-5">
    <header class="page-head">
      <h1>What's in my <span>fridge?</span> 🍳</h1>
    </header>

    <section class="ingredient-panel mb-5">
      <h2>What do you have?</h2>
      <div class="row g-4 align-items-stretch mt-1">
        <div class="col-12 col-lg-7">
          <label class="visually-hidden" for="search">Search ingredients</label>
          <input id="search" class="form-control ingredient-search" type="search" placeholder="Search ingredients..." autocomplete="off">
          <div id="foodlist" class="foodlist" aria-live="polite">Loading ingredients...</div>
        </div>
        <div class="col-12 col-lg-5">
          <div class="selected-area h-100">
            <div class="selected-heading"><h3>Your picks~</h3><span id="count" class="count">0</span></div>
            <div id="picked" class="picked">Nothing picked yet</div>
            <button id="find" class="btn find-btn w-100" type="button">Find recipes ↗</button>
          </div>
        </div>
      </div>
    </section>

    <section class="recipes-section">
      <div class="recipes-heading">
        <h2>Recipes for you~</h2>
      </div>
      <div id="recipes" class="row g-3 g-lg-4"></div>
    </section>
  </main>

  <div class="modal fade" id="recipebox" tabindex="-1" aria-labelledby="recipetitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="recipetitle">Recipe</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="recipeinfo"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
